---
layout: default
---
<article class="post">
  <h1 class="post-title">{{ page.title }}</h1>
  <p class="post-date">{{ page.date | date: "%Y년 %m월 %d일" }}</p>

  <div class="post-body">
    {{ content }}
  </div>

  <p class="back-link"><a href="{{ '/' | relative_url }}">← 목록으로 돌아가기</a></p>
</article>
