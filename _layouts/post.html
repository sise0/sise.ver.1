---
layout: default
---
<article class="post">
  <h1 class="post-title">{{ page.title }}</h1>
  <p class="post-date">{{ page.date | date: "%Y년 %m월 %d일" }}</p>

  <div class="post-body">
    {{ content }}
  </div>

  <p class="back-link"><a href="{{ '/' | relative_url }}">← 목록으로 돌아가기</a></p>
</article>

<!-- ===== 댓글 영역 ===== -->
<section class="comments" id="comments" data-post-id="{{ page.url }}">
  <h2 class="comments-heading">댓글</h2>

  <ul class="comment-list" id="comment-list">
    <li class="comment-loading">댓글을 불러오는 중...</li>
  </ul>

  <form class="comment-form" id="comment-form">
    <input class="comment-name" id="comment-name" type="text"
           maxlength="30" placeholder="이름" autocomplete="off" />
    <textarea class="comment-text" id="comment-text" rows="3"
              maxlength="800" placeholder="댓글을 남겨보세요"></textarea>
    <button class="comment-submit" type="submit">댓글 쓰기</button>
    <p class="comment-status" id="comment-status"></p>
  </form>
</section>

<script type="module" src="{{ '/assets/comments.js' | relative_url }}"></script>
